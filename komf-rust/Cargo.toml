[workspace]
resolver = "2"
members = [
    "crates/komf-api-models",
    "crates/komf-core",
    "crates/komf-mediaserver",
    "crates/komf-notifications",
    "crates/komf-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Snd-R/komf"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "charset", "http2", "rustls-tls"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
once_cell = "1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
thiserror = "1"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
bytes = "1"
mime_guess = "2"
url = "2"
async-stream = "0.3"
zstd = "0.13"
flate2 = "1"
tar = "0.4"
sha1 = "0.10"
image = "0.25"
scraper = "0.19"
percent-encoding = "2"

mimalloc = "0.1"
komf-api-models = { path = "crates/komf-api-models" }
komf-core = { path = "crates/komf-core" }
komf-mediaserver = { path = "crates/komf-mediaserver" }
komf-notifications = { path = "crates/komf-notifications" }
