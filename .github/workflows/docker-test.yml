name: Docker Test Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-binaries:
    name: Build binary (${{ matrix.arch }})
    runs-on: ubuntu-latest
    env:
      # OAuth client secrets：编译时注入（option_env! 固化进二进制）。
      # 与 release.yml 的 binary_release 保持一致，确保测试镜像同样携带 secret。
      KOMF_OAUTH_ANILIST_CLIENT_SECRET: ${{ secrets.KOMF_OAUTH_ANILIST_CLIENT_SECRET }}
      KOMF_OAUTH_MAL_CLIENT_SECRET: ${{ secrets.KOMF_OAUTH_MAL_CLIENT_SECRET }}
      KOMF_OAUTH_BANGUMI_CLIENT_SECRET: ${{ secrets.KOMF_OAUTH_BANGUMI_CLIENT_SECRET }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            cross: true
          - arch: arm64
            target: aarch64-unknown-linux-musl
            cross: true
    steps:
      - uses: actions/checkout@v7

      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install cross
        if: matrix.cross
        run: |
          cargo install cross --version 0.2.5 --locked

      - name: Build release binary
        if: ${{ !matrix.cross }}
        run: cargo build --locked --release --bin komf-app --target ${{ matrix.target }}

      - name: Build release binary with cross
        if: matrix.cross
        run: cross build --locked --release --bin komf-app --target ${{ matrix.target }}

      - name: Stage Docker runtime artifact
        run: |
          set -euo pipefail
          binary_path="target/${{ matrix.target }}/release/komf-app"
          test -f "$binary_path"
          mkdir -p docker-artifacts/linux-musl/${{ matrix.arch }}
          cp "$binary_path" docker-artifacts/linux-musl/${{ matrix.arch }}/komf-app
          chmod +x docker-artifacts/linux-musl/${{ matrix.arch }}/komf-app
          test -f docker-artifacts/linux-musl/${{ matrix.arch }}/komf-app

      - name: Upload Docker runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-artifacts-${{ matrix.arch }}
          path: docker-artifacts/linux-musl/${{ matrix.arch }}/komf-app
          if-no-files-found: error

  docker-test:
    name: Build and push test Docker image
    runs-on: ubuntu-latest
    needs: build-binaries
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}:test
      IMAGE_NAME_DOCKERHUB: dyphire/komf-rs:test
    steps:
      - uses: actions/checkout@v7

      - name: Download amd64 Docker runtime artifacts
        uses: actions/download-artifact@v8
        with:
          name: docker-artifacts-amd64
          path: docker-artifacts/linux-musl/amd64

      - name: Download arm64 Docker runtime artifacts
        uses: actions/download-artifact@v8
        with:
          name: docker-artifacts-arm64
          path: docker-artifacts/linux-musl/arm64

      - name: Verify Docker runtime artifacts
        run: |
          set -euo pipefail
          test -f docker-artifacts/linux-musl/amd64/komf-app
          test -f docker-artifacts/linux-musl/arm64/komf-app

      - name: Setup Node for WebUI
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package.json

      - name: Build WebUI
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web run build
          test -f web/dist/index.html

      - name: Strip Docker runtime artifacts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu
          strip --strip-unneeded docker-artifacts/linux-musl/amd64/komf-app
          aarch64-linux-gnu-strip --strip-unneeded docker-artifacts/linux-musl/arm64/komf-app

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}
            ${{ env.IMAGE_NAME_DOCKERHUB }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
